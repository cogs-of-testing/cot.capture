[build-system]
build-backend = "hatchling.build"
requires = [ "hatch-vcs", "hatchling", "vcs-versioning>=2.6" ]

[project]
name = "cot-capture"
description = "building blocks for capturing output at the slot and file descriptor level"
readme = "README.md"
license = "MIT"
license-files = [ "LICENSE" ]
authors = [
  { name = "Ronny Pfannschmidt", email = "opensource@ronnypfannschmidt.de" },
]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dynamic = [ "version" ]
optional-dependencies.pytest = [ "cot-config>=0.2", "pytest>=9" ]
urls.Source = "https://github.com/cogs-of-testing/cot.capture"

[dependency-groups]
test = [ "cot-config>=0.2", "pytest>=9" ]
typing = [ "mypy>=1" ]

[tool.hatch]
version.source = "vcs"
version.raw-options.version_scheme = "towncrier-fragments-zerover"
version.raw-options.fallback_version = "0.0.0"
build.targets.wheel.packages = [ "src/cot" ]
build.targets.wheel.sources = [ "src" ]

[tool.uv]
default-groups = [ "test", "typing" ]
# until cot.config.ingest#21 (add_config(..., adopt=True)) is released
sources.cot-config = { git = "https://github.com/cogs-of-testing/cot.config.ingest", branch = "claude/project-thread-5pb2dc" }

[tool.pytest]
ini_options.testpaths = [ "testing" ]
ini_options.filterwarnings = [ "error" ]

[tool.mypy]
files = [ "src" ]
strict = true
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true

[tool.towncrier]
directory = "changelog.d"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
template = "changelog.d/template.md"
title_format = "## {version} ({project_date})"
issue_format = "[#{issue}](https://github.com/cogs-of-testing/cot.capture/issues/{issue})"
underlines = [ "", "", "" ]

[[tool.towncrier.type]]
directory = "major"
name = "Major Changes"
showcontent = true

[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking Changes"
showcontent = true

[[tool.towncrier.type]]
directory = "removal"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecation"
name = "Deprecated"
showcontent = true

[[tool.towncrier.type]]
directory = "feature"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "doc"
name = "Documentation"
showcontent = true

[[tool.towncrier.type]]
directory = "misc"
name = "Miscellaneous"
showcontent = true
