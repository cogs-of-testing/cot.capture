repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
    - id: check-toml
    - id: check-yaml
    - id: end-of-file-fixer
    - id: trailing-whitespace

- repo: https://github.com/pre-commit/mirrors-mypy
  rev: v2.3.1
  hooks:
    - id: mypy
      # checks what [tool.mypy] names, not the staged files alone
      pass_filenames: false
      # cot-config from git until a cot-config release carries #21
      additional_dependencies:
        - pytest
        - "cot-config @ git+https://github.com/cogs-of-testing/cot.config.ingest@main"

- repo: https://github.com/zizmorcore/zizmor-pre-commit
  rev: v1.30.1
  hooks:
    - id: zizmor
